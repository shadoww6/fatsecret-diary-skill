[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fatsecret-diary"
version = "0.1.0"
description = "AI skill and CLI for your FatSecret food diary: log meals, edit entries, track weight, export to CSV"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fatsecret = "fatsecret_connector.cli:main"

[tool.setuptools]
package-dir = { "" = "fatsecret-diary/scripts" }
packages = ["fatsecret_connector"]
